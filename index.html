<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Letters to Heaven</title><style>:root{--n:#101a2b;--n2:#17243a;--c:#f7edcf;--g:#d5aa55;--i:#20261f}*{box-sizing:border-box}body{margin:0;background:var(--n);color:#fff;font:14px system-ui,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:300px 1fr}.side{padding:28px 22px;background:#0d1727;border-right:1px solid #26354b}.brand{font:24px Georgia,serif;color:#f5e7bc;margin-bottom:34px}.sub,.eyebrow{font:9px system-ui;letter-spacing:.18em;color:#8994a5}.search,input,textarea{width:100%;background:#111e31;border:1px solid #334158;border-radius:10px;padding:12px;color:#fff}.filters{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 24px}.pill,button{border:1px solid #35445a;background:#152238;color:#e7ebf0;border-radius:9px;padding:9px 13px;cursor:pointer}.pill{border-radius:99px;color:#9ea9b8}.active,.primary{background:#e7d49d!important;color:#17202d!important;border-color:#e7d49d!important}.card{background:var(--n2);border:1px solid #27364c;border-radius:13px;padding:15px;margin-bottom:22px}.trust{color:#aab2bf;font-size:11px;line-height:1.5}.main{background:radial-gradient(circle at 85% 10%,#23324b 0,transparent 32%),var(--n)}header{display:flex;justify-content:space-between;align-items:center;padding:35px 48px;border-bottom:1px solid #26354b}h1,h2{font-family:Georgia,serif;font-weight:500}h1{margin:0;font-size:32px}header p{color:#9ca7b7;font-size:12px}.actions{display:flex;gap:9px}.content{max-width:1000px;margin:auto;padding:42px 48px}.letter{background:var(--c);color:var(--i);border-radius:17px;padding:34px 42px;min-height:510px;box-shadow:0 25px 70px #0004}.meta{font-size:9px;letter-spacing:.15em;color:#6e6a5f;display:flex;justify-content:space-between}.badge{background:#b8c8a7;padding:4px 7px;border-radius:99px;margin-left:6px;font-size:9px;letter-spacing:0}.head{display:flex;justify-content:space-between;gap:25px;margin-top:26px}.letter h2{font-size:38px;margin:0 0 12px}.tags span{display:inline-block;background:#e5d8b5;padding:5px 8px;border-radius:99px;font-size:9px;margin:0 5px 5px 0}.keep{width:125px;height:95px;border-radius:10px;background:linear-gradient(135deg,#aab68d,#557159);display:grid;place-items:center;text-align:center;color:#f9efd1;font:15px Georgia,serif}.keep small{font:7px system-ui}.body{max-width:690px;margin:38px auto;font:18px/1.7 Georgia,serif;white-space:pre-line}.foot{border-top:1px solid #d9cfb4;padding-top:14px;color:#777160;font-size:9px}.candle{margin-top:16px;background:var(--n2);border:1px solid #2a394f;border-radius:12px;padding:14px 17px;display:flex;justify-content:space-between;align-items:center}.privacy{text-align:center;color:#818d9e;font-size:10px;line-height:1.5;margin:22px auto}.modal{position:fixed;inset:0;background:#03080fcc;display:grid;place-items:center;padding:20px}.composer{width:min(620px,100%);background:var(--n2);border:1px solid #324158;border-radius:18px;padding:30px}.composer>*{margin:7px 0}.composer textarea{min-height:220px;resize:vertical}@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}header{padding:25px}.content{padding:25px 15px}.letter{padding:25px 22px}.head{display:block}.keep{margin-top:18px}}</style></head><body><div id="root"></div><script>const seed={id:1,name:'Mom',title:'To Mom',date:'May 11, 2025',status:'Released',tags:['gratitude','Birthday','candle','shared'],body:'Dear Mom,\n\nI finally planted the hydrangeas you always wanted in the front yard. They’re blue, just like the ones in your old gardening book. I talk to them sometimes. It feels silly, and also right.\n\nI miss your laugh in the kitchen. The house is quieter without it, but I’m learning how to keep the warmth you left behind.\n\nLove you, always.',shared:true,candle:true};let L=JSON.parse(localStorage.lth||'null')||[seed],sel=L[0].id,filter='All',q='';const save=()=>localStorage.lth=JSON.stringify(L),esc=s=>String(s).replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]));function render(){let a=L.find(x=>x.id===sel)||L[0],shown=L.filter(x=>(filter==='All'||filter==='Released'&&x.status==='Released'||filter==='Kept close'&&x.status==='Kept'||filter==='Shared'&&x.shared)&&(`${x.name} ${x.title} ${x.body}`.toLowerCase().includes(q.toLowerCase())));root.innerHTML=`<div class=app><aside class=side><div class=brand>✦ Letters to Heaven<div class=sub>A QUIET PLACE FOR WHAT REMAINS</div></div><div class=eyebrow>VAULT · ${L.length} letters</div><input class=search placeholder="Search names, feelings…" value="${esc(q)}"><div class=filters>${['All','Kept close','Released','Shared'].map(x=>`<button class="pill ${filter===x?'active':''}" onclick="filter='${x}';render()">${x}</button>`).join('')}</div><div class=card><div class=eyebrow>UPCOMING</div><b>Dad’s anniversary</b><br><small>in 26 days</small></div><div class=eyebrow>REMEMBERING</div><p>${[...new Set(L.map(x=>x.name))].map(n=>`<button onclick="sel=L.find(x=>x.name===${JSON.stringify(n)}).id;render()">${esc(n)}</button>`).join(' ')}</p><div class=card><b>${shown.length?'Your vault is ready.':'No letters in this view.'}</b><br><button onclick=openCompose()>Write a letter</button></div><div class=trust>Private by default. Shared letters only appear if you choose. No tracking, no counts.</div></aside><main class=main><header><div><h1>Letters to Heaven</h1><p>Words for the people and memories we carry.</p></div><div class=actions><button onclick=candle()>🕯 ${L.filter(x=>x.candle).length}</button><button class=primary onclick=openCompose()>Write</button></div></header><section class=content>${a?`<article class=letter><div class=meta><span>${a.date.toUpperCase()} · ${a.status.toUpperCase()}</span><span>${a.shared?'<i class=badge>Shared</i>':''}${a.candle?'<i class=badge>Candle lit</i>':''}</span></div><div class=head><div><h2>${esc(a.title)}</h2><div class=tags>${a.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div></div><div class=keep>hydrangeas<small>a memory kept close</small></div></div><div class=body>${esc(a.body)}</div><div class=foot>${a.date} · ${a.candle?'candle lit':'vault'} · keepsake</div></article><div class=candle><span>✦ CANDLES LIT · ${L.filter(x=>x.candle).length} · ${esc(a.name)}</span><button onclick=candle()>${a.candle?'Candle lit':'Light a candle'}</button></div><div class=privacy>Your letters are private and stay on this device.<br>If grief feels overwhelming, consider reaching out to someone you trust.</div>`:'<div class=privacy>No letters in this view.</div>'}</section></main></div>`;document.querySelector('.search').oninput=e=>{q=e.target.value;render()}}function candle(){let a=L.find(x=>x.id===sel);if(a){a.candle=true;a.tags=[...new Set([...a.tags,'candle'])];save();render()}}function openCompose(){root.insertAdjacentHTML('beforeend',`<div class=modal><div class=composer><div class=eyebrow>WRITE A LETTER</div><h2>A few words are enough.</h2><input id=n placeholder="Who are you writing to?"><input id=t placeholder="Title (optional)"><textarea id=b placeholder="Write whatever needs to be said…"></textarea><button onclick=closeM()>Cancel</button> <button class=primary onclick=addLetter()>Keep this letter</button></div></div>`)}function closeM(){document.querySelector('.modal')?.remove()}function addLetter(){let n=document.querySelector('#n').value.trim(),b=document.querySelector('#b').value.trim(),t=document.querySelector('#t').value.trim();if(!n||!b)return;let x={id:Date.now(),name:n,title:t||'To '+n,date:new Date().toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}),status:'Kept',tags:['new'],body:b,shared:false,candle:false};L.unshift(x);sel=x.id;save();render()}render();</script></body></html>
